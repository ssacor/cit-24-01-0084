# Part 7 — Headless Service for the database tier
# Headless means clusterIP: None. A StatefulSet needs a headless
# Service so each pod gets a stable network name (postgres-0,
# postgres-1, ...). This Service does NOT load-balance; it gives
# each pod its own identity.
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
