# Part 5 — Exposing the Deployment with a Service
# A Service is a stable "front door" to your pods.
# Pods come and go (with new IPs), but the Service keeps one fixed
# address. NodePort makes it reachable from outside the cluster
# (your browser) on a high port like 30000+.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80        # the port the Service listens on
      targetPort: 80  # the port the pod container uses
